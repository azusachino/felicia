version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "apps/providers/postgres/queries/"
    gen:
      go:
        package: "db"
        out: "apps/providers/postgres/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
