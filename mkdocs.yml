site_name: felicia
site_description: A map-based travel journal — research-stage docs.
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

# Mermaid is rendered by Material's built-in integration, which loads the
# minified Mermaid build from the jsDelivr CDN at runtime.
markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
  - awesome-pages
