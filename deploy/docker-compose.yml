version: '3.8'

services:
  db:
    image: postgis/postgis:18-3.6-alpine
    container_name: felicia-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: felicia
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d felicia"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: felicia-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_DSN=postgres://postgres:password@db:5432/felicia?sslmode=disable
      - WAYPOINTS_IMMICH_API_KEY=${WAYPOINTS_IMMICH_API_KEY}
      - WAYPOINTS_DAWARICH_API_KEY=${WAYPOINTS_DAWARICH_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: felicia-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  pgdata:
