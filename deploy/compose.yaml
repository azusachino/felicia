services:
  db:
    image: postgis/postgis:18-3.6-alpine
    container_name: felicia-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: felicia
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d felicia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
