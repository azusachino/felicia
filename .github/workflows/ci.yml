name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No required status checks are configured; revisit this filter if that changes.
    paths-ignore:
      - README.md
      - 'docs/**'

env:
  MISE_LOCKED: "1"

permissions:
  contents: read

# A unique main-run group preserves pending main runs as well as running ones.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      global: ${{ steps.filter.outputs.global }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop_e2e: ${{ steps.filter.outputs.desktop_e2e }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            global: &global
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'mise.toml'
              - 'mise.lock'
              - 'go.work*'
            backend:
              - *global
              - 'apps/felicia-cli/**'
              - 'apps/felicia-core/**'
              - 'apps/felicia-desktop/**'
              - 'apps/felicia-providers/**'
              - 'apps/felicia-publication/**'
              - 'apps/felicia-runtime/**'
              - 'apps/felicia-server/**'
              - '**/go.mod'
              - '**/go.sum'
              - 'scripts/**'
              - 'tests/**'
              - 'contracts/**'
              - 'schemas/**'
            frontend:
              - *global
              - 'apps/felicia-admin/**'
              - 'apps/felicia-public-site/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
            desktop_e2e:
              - *global
              - 'apps/felicia-desktop/**'
              - 'apps/felicia-admin/**'
              - 'apps/felicia-public-site/**'
              - 'packages/**'
              - 'scripts/go_tasks.py'
            code:
              - *global
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'tests/**'
              - 'contracts/**'
              - 'schemas/**'
              - 'package.json'
              - 'bun.lock'
              - '**/go.mod'
              - '**/go.sum'

  desktop-e2e:
    name: Desktop composition (Chromium + WebKit)
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.global == 'true' || needs.changes.outputs.desktop_e2e == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mise toolchain
        uses: jdx/mise-action@v4
      - name: Cache Go build and modules
        id: go-cache
        run: |
          echo "build=$(mise exec -- go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(mise exec -- go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: go-${{ runner.os }}-${{ hashFiles('go.work*', '**/go.mod', '**/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.work*', '**/go.mod', '**/go.sum') }}-
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/felicia-admin/package.json') }}
      - name: Install frontend dependencies
        run: make web-install
      - name: Install pinned Playwright browsers
        run: make e2e-install
      - name: Run integrated desktop-composition tests
        run: make e2e
      - name: Keep synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-browser-evidence
          path: apps/felicia-admin/test-results/
          if-no-files-found: warn

  backend:
    name: Backend (make check-ci)
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.global == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # No PostgreSQL service. SQLite is the only v1 persistence contract
    # (ADR-0032), and the v1 gate must not require a PostgreSQL service, its
    # migrations, or its behavioural parity. The provider stays in the tree as
    # frozen non-v1 work; its checks return with the re-entry milestone rather
    # than running here in a lane that cannot block anything meaningful.
    steps:
      - uses: actions/checkout@v7

      - name: Install mise toolchain
        uses: jdx/mise-action@v4

      - name: Cache Go build and modules
        id: go-cache
        run: |
          echo "build=$(mise exec -- go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(mise exec -- go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: go-${{ runner.os }}-${{ hashFiles('go.work*', '**/go.mod', '**/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.work*', '**/go.mod', '**/go.sum') }}-
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install frontend dependencies
        run: make web-install

      - name: Check (vet, lint, race tests)
        run: make check-ci

      - name: SQLite journey workflow
        run: make test-workflow

  frontend:
    name: Frontend (make web-check)
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.global == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise toolchain
        uses: jdx/mise-action@v4

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install frontend deps
        run: make web-install

      - name: Check (svelte-check, eslint, prettier)
        run: make web-check

      - name: Check admin frontend
        run: make admin-check

  docs:
    name: Documentation (make fmt-docs-check)
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mise toolchain
        uses: jdx/mise-action@v4
      - name: Check documentation formatting
        run: make fmt-docs-check

  check:
    name: make check
    if: ${{ always() }}
    needs: [changes, desktop-e2e, backend, frontend, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          DESKTOP_RESULT: ${{ needs['desktop-e2e'].result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          for res in "$DESKTOP_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT" "$DOCS_RESULT"; do
            if [[ "$res" != "success" && "$res" != "skipped" ]]; then
              echo "Gate failed with state: $res"
              exit 1
            fi
          done
          ran=0
          for res in "$DESKTOP_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT" "$DOCS_RESULT"; do
            if [[ "$res" == "success" ]]; then
              ran=1
              break
            fi
          done
          if [[ $ran -ne 1 ]]; then
            echo "No gate was executed"
            exit 1
          fi
