name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (make check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: felicia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d felicia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The service database is disposable for this CI job. Destructive tests
      # use this dedicated test DSN, never the normal runtime DSN.
      DATABASE_DSN: postgres://postgres:password@localhost:5432/felicia?sslmode=disable
      FELICIA_TEST_DATABASE_DSN: postgres://postgres:password@localhost:5432/felicia?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Install Nix (golangci-lint, goose from the flake)
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Apply migrations
        run: make migrate

      - name: Check (fmt, vet, lint, race tests)
        run: make check

      - name: SQLite journey workflow
        run: make test-workflow

  frontend:
    name: Frontend (make web-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: make web-install

      - name: Check (svelte-check, eslint, prettier)
        run: make web-check

      - name: Check admin frontend
        run: make web-admin-check
