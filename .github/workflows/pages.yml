name: Publish production catalog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise toolchain
        uses: jdx/mise-action@v4

      - name: Install frontend dependencies
        run: mise exec -- bun install --frozen-lockfile

      - name: Build CLI-backed static artifact
        run: BASE_PATH="/${{ github.event.repository.name }}/" mise exec -- uv run python scripts/felicia.py publish

      - name: Verify static artifact
        run: BASE_PATH="/${{ github.event.repository.name }}/" mise exec -- uv run python scripts/verify_static_artifact.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/felicia-public-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
