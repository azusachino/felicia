[tools]
# Runtimes stay pinned here, at the shared minor versions, because CI installs
# from this file alone; the workstation config does not reach CI runners.
# Python stays on 3.14: psycopg-binary has no cp315 wheels yet.
go = "1.27"
bun = "1.4"
node = "26.13"
python = "3.14"
uv = "0.13"
golangci-lint = "2.15"

[env]
_.file = ".env"
