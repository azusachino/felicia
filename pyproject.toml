# Python development and docs tooling — felicia's application runtime is Go.
# uv manages this isolated environment for scripts, feature tests, and docs.
[project]
name = "felicia-docs"
version = "0.1.0"
description = "MkDocs preview tooling for felicia docs."
requires-python = ">=3.14"
dependencies = [
  "jsonschema>=4.23.0,<5",
]

[dependency-groups]
docs = [
  # Pin to the 9.5.x line: 9.6.0 added a build-time MkDocs-2.0 promo banner.
  "mkdocs-material>=9.5,<9.6",
  "pymdown-extensions>=10",
  "mkdocs-awesome-pages-plugin>=2.9.2",
]
dev = [
  "psycopg[binary]>=3.2.0",
  "ruff>=0.12,<0.13",
]

[tool.uv]
package = false
default-groups = []
